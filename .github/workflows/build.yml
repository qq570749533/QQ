name: Build Cydia Repo
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev apt-utils

      - name: Generate Packages index
        run: |
          cd debs
          dpkg-scanpackages . /dev/null > ../Packages
          gzip -k -f ../Packages

      - name: Generate Release file
        run: |
          cat > Release <<EOF
Origin: My Repo
Label: My Repo
Suite: stable
Codename: stable
Architectures: arm64 arm64e
Components: main
Description: My iOS Repo
EOF
          apt-ftparchive release . >> Release

      - name: Commit index files
        run: |
          git config --global user.name "qq570749533"
          git config --global user.email "qq570749533@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update repo index" || echo "No changes to commit"
          git push
